econdary{background:#292c33;color:#d7d8dd;box-shadow:none}.btn.secondary:hover{background:#383b43}.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}.rightcol{padding-top:12px}.sidecard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:13px}.sidehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.sidehead h3{font:600 13px var(--display);margin:0}.sidehead button{font:10px var(--mono);color:#ff777d;background:none;border:0}.crew{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #292c32}.creature{width:34px;height:34px;background:#24272d;border-radius:8px;display:grid;place-items:center;font-size:20px;flex-shrink:0}.creature-info{flex:1;min-width:0}.creature-info b{font-size:11px;display:block}.creature-info span{font:9px var(--mono);color:var(--muted)}.level{font:9px var(--mono);color:#c3c4ca}.crew-more{border-top:1px solid #292c32;padding-top:10px;color:var(--muted);font-size:10px;text-align:center}.upgrade{border-top:1px solid #292c32;padding:11px 0}.upgrade:first-of-type{border-top:0;padding-top:0}.up-row{display:flex;justify-content:space-between;align-items:center}.up-title{font-size:11px;font-weight:600}.up-level{color:var(--gold);font:9px var(--mono)}.up-desc{font-size:10px;color:var(--muted);margin:4px 0 9px}.up-action{display:flex;justify-content:space-between;align-items:center}.price{font:10px var(--mono);color:var(--gold)}.upgrade .btn{font-size:9px;padding:6px 8px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:#262a30;border:1px solid #464a53;border-radius:9px;padding:12px 17px;box-shadow:0 12px 40px #0008;z-index:20;opacity:0;pointer-events:none;transition:.25s;font-size:12px}.toast.show{opacity:1;transform:translate(-50%,0)}
.modal-backdrop{position:fixed;inset:0;background:#08090bc9;backdrop-filter:blur(5px);z-index:10;display:none;align-items:center;justify-content:center;padding:18px}.modal-backdrop.open{display:flex}.modal{width:min(510px,100%);background:#1b1d22;border:1px solid #3b3e46;border-radius:15px;box-shadow:0 25px 100px #0009;padding:24px;animation:rise .2s ease-out}@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}.modal-top{display:flex;align-items:start;justify-content:space-between}.modal h2{font:600 20px var(--display);margin:5px 0}.close{background:#292c32;border:0;border-radius:7px;width:29px;height:29px;font-size:18px;color:#bbb}.modal-copy{color:#a7a9b0;font-size:12px;line-height:1.6;margin:8px 0 18px}.encounter{border:1px solid #393c44;border-radius:11px;background:linear-gradient(140deg,#24272e,#1c1e23);padding:19px;text-align:center;margin:15px 0}.encounter .bigmon{font-size:57px;filter:drop-shadow(0 5px 10px #0006)}.encounter h3{font:600 16px var(--display);margin:8px 0 3px}.encounter p{font-size:11px;color:var(--muted);margin:0}.odds{display:flex;justify-content:space-around;margin:16px 0 2px;padding-top:13px;border-top:1px solid #35383f;color:#c5c6cb;font:10px var(--mono)}.odds b{color:var(--green);font-weight:500}.strategy{display:grid;grid-template-columns:1fr 1fr;gap:9px}.strategy button{border:1px solid #42454e;background:#26292f;border-radius:9px;padding:12px;text-align:left}.strategy button:hover{border-color:#ed3b45;background:#302427}.strategy b{font-size:11px;display:block;margin-bottom:4px}.strategy span{font-size:10px;color:#a4a6ad;line-height:1.35;display:block}.result{text-align:center;padding:8px 10px 2px}.result .result-icon{font-size:49px}.result h2{margin:8px 0}.result p{font-size:12px;color:#b1b3bb;line-height:1.6}.result-rewards{display:flex;gap:9px;justify-content:center;margin:17px 0}.reward{background:#272a30;border-radius:8px;padding:8px 12px;font:10px var(--mono);color:#d8d9dd}.base-grid{display:gr <body><div class="app"><header class="topbar"><div class="brand"><div class="brandmark">✦</div><div class="brandname">ROCKET<small>BLACK MARKET DIVISION</small></div></div><div class="top-right"><div class="resource"><span class="coin">◈</span><span id="creditsTop">0</span><span style="color:var(--muted)">₽</span></div><div class="resource"><span style="color:var(--red2)">◆</span><span id="repTop">0</span><span style="color:var(--muted)">REP</span></div><div class="user"><div class="avatar">R</div><div class="user-label"><b>ROOKIE #047</b><span id="rankUser">Rocket Grunt</span></div></div></div></header><div class="layout"><aside class="sidebar"><div class="section-label">OPERATIONS</div><nav class="nav"><button class="active" data-view="dashboard"><span class="nav-icon">▦</span>Command desk</button><button data-view="missions"><span class="nav-icon">⌖</span>Field missions<span class="nav-count">3</span></button><button data-view="roster"><span class="nav-icon">◉</span>Pokémon roster<span class="nav-count" id="rosterCount">2</span></button><button data-view="base"><span class="nav-icon">⌂</span>Hideout</button></nav><div class="section-label" style="margin-top:29px">INTEL BRIEF</div><div class="sidebar-bottom"><span class="tiny-title">CURRENT DIRECTIVE</span><strong id="directive">Prove your worth</strong><p id="directiveCopy">Bring stolen Pokémon and credits to HQ. Earn your stripes.</p></div></aside><main class="content" id="mainContent"></main><aside class="rightcol" id="rightContent"></aside></div></div><div class="toast" id="toast"></div><div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<script>
const ranks=[{name:'Rocket Grunt',short:'Grunt',rep:0},{name:'Rocket Agent',short:'Agent',rep:80},{name:'Rocket Executive',short:'Executive',rep:250},{name:'Rocket Boss',short:'Boss',rep:500}];
const species=[{name:'Pikachu',emoji:'⚡',type:'Electric',power:5},{name:'Oddish',emoji:'🌿',type:'Grass',power:3},{name:'Psyduck',emoji:'🦆',type:'Water',power:4},{name:'Growlithe',emoji:'🐕',type:'Fire',power:5},{name:'Abra',emoji:'🔮',type:'Psychic',power:6},{name:'Eevee',emoji:'🦊',type:'Normal',power:4},{name:'Machop',emoji:'💪',type:'Fighting',power:5},{name:'Dratini',emoji:'🐉',type:'Dragon',power:7},{name:'Jigglypuff',emoji:'🎤',type:'Fairy',power:3},{name:'Vulpix',emoji:'🦊',type:'Fire',power:4},{name:'Magnemite',emoji:'🧲',type:'Electric',power:4},{name:'Bulbasaur',emoji:'🌱',type:'Grass',power:5}];
const jobs=[{id:'route',icon:'🌾',title:'Route 06 — Quiet Snatch',place:'VERMILION OUTSKIRTS',desc:'A trainer camping alone has been spotted with a rare partner.',difficulty:1,credits:48,rep:28,bonus:0},{id:'market',icon:'🌃',title:'Midnight Market Sting',place:'CELADON CITY',desc:'Lift a Pokémon from the back alley trade before the deal closes.',difficulty:2,credits:76,rep:43,bonus:1},{id:'coast',icon:'🌊',title:'Coastal Intercept',place:'CERULEAN CAPE',desc:'A hot-headed trainer is showing off a powerful new catch.',difficulty:3,credits:104,rep:58,bonus:2}];
const defaultState={credits:110,rep:0,inventory:[{name:'Meowth',emoji:'🐈',type:'Normal',power:4,level:3,id:1},{name:'Zubat',emoji:'🦇',type:'Poison',power:3,level:2,id:2}],upgrades:{quarters:0,lab:0,training:0},baseSize:1,missions:0,nextId:3};
let state;try{state={...defaultState,...JSON.parse(localStorage.getItem('rocket-save')||'{}')};state.inventory=Array.isArray(state.inventory)?state.inventory:defaultState.inventory;state.upgrades={...defaultState.upgrades,...state.upgrades}}catch{state=structuredClone(defaultState)}
let currentJob=null,encounter=null,toastTimer;
function save(){localStorage.setItem('rocket-save',JSON.stringify(state));render()}
function currentRank(){let found=0;ranks.forEach((r,i)=>{if(state.rep>=r.rep)found=i});return found}
function nextRank(){return ranks[currentRank()+1]}
function totalPower(){return state.inventory.reduce((n,p)=>n+p.power+(p.level-1)*.25,0)}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2500)}
function setView(view){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='dashboard'||view==='missions')renderDashboard(view);if(view==='roster')renderRoster();if(view==='base')renderBase();window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
function render(){document.getElementById('creditsTop').textContent=state.credits.toLocaleString();document.getElementById('repTop').textContent=state.rep.toLocaleString();document.getElementById('rankUser').textContent=ranks[currentRank()].name;document.getElementById('rosterCount').textContent=state.inventory.length;const next=nextRank();document.getElementById('directive').textContent=next?`Reach ${next.short} rank`:'Expand your empire';document.getElementById('directiveCopy').textContent=next?`${next.rep-state.rep} reputation until your next promotion. Complete field operations.`:'You run the syndicate now. Build a hideout worthy of your name.';let active=document.querySelector('.nav button.active')?.dataset.view||'dashboard';if(active==='roster')renderRoster();else if(active==='base')renderBase();else renderDashboard(active)}
function rankProgress(){let rank=ranks[currentRank()],next=nextRank();return {rank,next,percent:next?Math.min(100,(state.rep-rank.rep)/(next.rep-rank.rep)*100):100}}
function rankBlock(){const p=rankProgress();return `<div class="rankbar"><div class="ranktop"><div class="ranktext">RANK PROGRESSION &nbsp; <b>${p.rank.name}</b></div><div class="ranknums">${p.next?`${state.rep} / ${p.next.rep} REP`:`${state.rep} REP · MAX RANK`}</div></div><div class="progress"><i style="width:${p.percent}%"></i></div><div class="rankfoot"><span>${p.rank.short.toUpperCase()}</span><span>${p.next?`${p.next.short.toUpperCase()} PROMOTION`:'BOSS · SYNDICATE LEADER'}</span></div></div>`}
function renderDashboard(mode='dashboard'){const next=nextRank(),boss=currentRank()===3;document.getElementById('mainContent').innerHTML=`<div class="welcome"><div><div class="eyebrow">${boss?'SYNDICATE COMMAND':`${ranks[currentRank()].name.toUpperCase()} · HEADQUARTERS`}</div><h1>${boss?'The city is yours.':'Good evening, Rookie.'}</h1><p>${boss?'Your empire is growing. Keep the operation moving.':'The boss is watching. Make every operation count.'}</p></div><span class="rank-pill">● &nbsp;${ranks[currentRank()].short} status</span></div>${rankBlock()}<section class="hero"><div class="eyebrow">TONIGHT’S PRIORITY</div><h2>${boss?'Expand the operation':'Build your reputation'}</h2><p>${boss?'Upgrade your hideout, recruit specialists, and make the Rocket name impossible to ignore.':'Run field operations, take Pokémon from trainers, and earn the trust of the higher-ups.'}</p><div class="hero-meta"><span>◈ &nbsp; CREDITS FUND UPGRADES</span><span>◆ &nbsp; ${next?`${next.rep-state.rep} REP TO PROMOTION`:'BOSS RANK UNLOCKED'}</span></div><div class="hero-graphic">🚀</div></section><div class="heading"><div><h2>Available operations</h2><div class="sub">Pick a target. Bring a partner. Make it quick.</div></div><button class="text-button" onclick="setView('missions')">ALL MISSIONS ↗</button></div><div class="mission-list">${jobs.map(job=>missionCard(job)).join('')}</div>`;renderRight()}
function missionCard(job){return `<article class="mission"><div class="mission-icon">${job.icon}</div><div><h3>${job.title}</h3><p>${job.desc}</p><div class="mission-tags"><span>◈ ${job.credits} ₽</span><span>◆ +${job.rep} REP</span><span>⚑ ${['LOW','MODERATE','HIGH'][job.difficulty-1]} RISK</span></div></div><button class="btn" onclick="startMission('${job.id}')">DISPATCH →</button></article>`}
function renderRight(){const crew=state.inventory.slice(0,3);let upgrades=[['quarters','Crew quarters','More hands make better odds.',75,1],['lab','Snagging gear','Better tools improve steal chance.',100,2],['training','Field training','Your Pokémon gain extra mission power.',125,1]];document.getElementById('rightContent').innerHTML=`<section class="sidecard"><div class="sidehead"><h3>Active crew</h3><button onclick="setView('roster')">VIEW ALL</button></div>${crew.map(p=>`<div class="crew"><div class="creature">${p.emoji}</div><div class="creature-info"><b>${p.name}</b><span>${p.type} · POWER ${p.power}</span></div><span class="level">LV.${p.level}</span></div>`).join('')}${state.inventory.length>3?`<div class="crew-more">+ ${state.inventory.length-3} more on roster</div>`:''}</section><section class="sidecard"><div class="sidehead"><h3>Hideout upgrades</h3><button onclick="setView('base')">MANAGE</button></div>${upgrades.map(([id,name,desc,cost,rank])=>{let unlocked=currentRank()>=rank,lv=state.upgrades[id];return `<div class="upgrade"><div class="up-row"><span class="up-title">${name}</span><span class="up-level">${unlocked?`LV. ${lv}`:'🔒'}</span></div><div class="up-desc">${unlocked?desc:`Unlocks at ${ranks[rank].short} rank`}</div><div class="up-action"><span class="price">◈ ${cost+lv*50} ₽</span><button class="btn secondary" ${!unlocked||state.credits<cost+lv*50?'disabled':''} onclick="buyUpgrade('${id}')">UPGRADE</button></div></div>`}).join('')}</section>`}
function renderRoster(){document.getElementById('mainContent').innerHTML=`<div class="welcome"><div><div class="eyebrow">FIELD ASSETS</div><h1>Pokémon roster</h1><p>Your partners in crime. Every one taken fair and square.</p></div><span class="rank-pill">◉ &nbsp;${state.inventory.length} IN CUSTODY</span></div>${rankBlock()}<div class="heading"><div><h2>Available partners</h2><div class="sub">Higher power increases your chance of a clean snatch.</div></div></div><div class="sidecard roster-grid">${state.inventory.length?state.inventory.map(p=>`<div class="roster-row"><div class="creature">${p.emoji}</div><div class="creature-info"><b>${p.name}</b><span>${p.type} type · POWER ${p.power}</span></div><span class="level">LV. ${p.level}</span></div>`).join(''):'<div class="empty">No Pokémon in your roster yet.<br>Take a field mission to recruit your first partner.</div>'}</div>`;renderRight()}
function renderBase(){const boss=currentRank()===3;let tiles=[['🛏️','Crew quarters',state.upgrades.quarters,'More Rocket grunts join your operation.'],['🧪','Snagging gear',state.upgrades.lab,'Prototype tech helps secure wild Pokémon.'],['🥊','Training room',state.upgrades.training,'Your Pokémon get stronger with every job.']];document.getElementById('mainContent').innerHTML=`<div class="welcome"><div><div class="eyebrow">TEAM ROCKET HIDEOUT</div><h1>${boss?'A growing empire.':'Your place in the shadows.'}</h1><p>${boss?'As boss, you can expand the hideout and build a syndicate.':'Earn promotions to unlock new hideout facilities.'}</p></div><span class="rank-pill">⌂ &nbsp;${boss?'SECTOR '+state.baseSize:'TIER '+(currentRank()+1)}</span></div>${rankBlock()}<div class="heading"><div><h2>Hideout facilities</h2><div class="sub">Permanent upgrades for your operation.</div></div></div><div class="base-grid">${tiles.map(([icon,name,lv,desc],i)=>`<article class="base-tile ${currentRank()<i+1?'locked':''}"><div class="tile-icon">${icon}</div><h3>${name} ${currentRank()>=i+1?`<span style="color:var(--gold);font:9px var(--mono)">LV.${lv}</span>`:''}</h3><p>${currentRank()<i+1?`Unlock at ${ranks[i+1].short} rank`:desc}</p></article>`).join('')}</div>${boss?`<section class="sidecard" style="margin-top:13px"><div class="sidehead"><h3>Hideout expansion</h3><span class="up-level">SECTOR ${state.baseSize}</span></div><p style="color:#a3a5ad;font-size:11px;line-height:1.55">You have the authority to grow your operation. Each expansion opens a new sector and brings passive income from the underground.</p><div class="up-action"><span class="price">◈ ${300+state.baseSize*250} ₽</span><button class="btn" ${state.credits<300+state.baseSize*250?'disabled':''} onclick="expandBase()">EXPAND HIDEOUT</button></div></section>`:`<section class="sidecard" style="margin-top:13px"><div class="eyebrow">NEXT MILESTONE</div><h3 style="font:600 15px var(--display);margin:8px 0">${boss?'Boss of Team Rocket':'Rise through the ranks'}</h3><p style="color:#9da0a7;font-size:11px;line-height:1.6;margin:0">${boss?'Your organization is yours to shape.':`Reach ${ranks[Math.min(currentRank()+1,3)].name} to unlock more of your hideout. ${nextRank()?.rep-state.rep||0} reputation to go.`}</p></section>`}`;renderRight()}
function startMission(id){currentJob=jobs.find(j=>j.id===id);if(!currentJob)return;const seen=new Set(state.inventory.map(p=>p.name));let eligible=species.filter(s=>!seen.has(s.name));if(!eligible.length)eligible=species;encounter=eligible[Math.floor(Math.random()*eligible.length)];const power=totalPower()*.45+(state.upgrades.training*.75),gear=state.upgrades.lab*9;const chance=Math.max(22,Math.min(91,70+power*2+gear-currentJob.difficulty*15));openModal(`<div class="modal-top"><div><div class="eyebrow">${currentJob.place}</div><h2>Target in sight</h2></div><button class="close" onclick="closeModal()">×</button></div><p class="modal-copy">Your lookout spotted a trainer with a <b>${encounter.name}</b>. Your crew is in position. How do you want to make the grab?</p><div class="encounter"><div class="bigmon">${encounter.emoji}</div><h3>${encounter.name}</h3><p>${encounter.type} type · EST. POWER ${encounter.power}</p><div class="odds"><span>SNAG SUCCESS <b>~${Math.round(chance)}%</b></span><span>CREW POWER <b>${Math.round(power*10)/10}</b></span></div></div><div class="strategy"><button onclick="resolveMission('sneak',${chance})"><b>◌ &nbsp;Stay stealthy</b><span>Lower risk. A careful, measured play.</span></button><button onclick="resolveMission('snag',${chance})"><b>✦ &nbsp;Go for the snag</b><span>Best chance to claim the Pokémon.</span></button></div><p style="font:9px var(--mono);color:var(--muted);text-align:center;margin:13px 0 0">Crew earns mission rewards either way. No partner left behind.</p>`)}
function resolveMission(strategy,chance){let odds=strategy==='sneak'?Math.min(96,chance+7):chance;let success=Math.random()*100<odds;let credits=Math.round(currentJob.credits*(success?1:.7));let rep=Math.round(currentJob.rep*(success?1:.7));let caught=success&&Math.random()*100<(strategy==='snag'?91:68);let recruit=null;if(caught){recruit={...encounter,level:Math.max(1,Math.floor(Math.random()*3)+1),id:state.nextId++};state.inventory.push(recruit)}state.credits+=credits;state.rep+=rep;state.missions++;if(state.upgrades.training>0)state.inventory.forEach(p=>{p.level+=Math.random()<.25?1:0});let promoted=nextRank()&&state.rep>=nextRank().rep;let rewardText=`<div class="result-rewards"><span class="reward">◈ +${credits} ₽</span><span class="reward">◆ +${rep} REP</span></div>`;let recruitText=recruit?`<br><b style="color:var(--green)">${recruit.emoji} ${recruit.name} joined the crew!</b>`:success?'<br>The target escaped in the confusion.':'<br>Your crew got away safely, but the target slipped through.';closeModal();openModal(`<div class="result"><div class="result-icon">${recruit?'🎯':success?'🕶️':'💨'}</div><div class="eyebrow">${success?'OPERATION COMPLETE':'CLEAN GETAWAY'}</div><h2>${recruit?'Asset secured!':success?'A tidy little operation.':'They got away this time.'}</h2><p>${success?'Your crew pulled off the job without a hitch.':`Your crew made a quick exit with some loot.`}${recruitText}</p>${rewardText}${promoted?`<div style="color:var(--gold);font:11px var(--mono);margin-bottom:13px">★ PROMOTION UNLOCKED — ${ranks[currentRank()].name.toUpperCase()} ★</div>`:''}<button class="btn" style="width:100%" onclick="closeModal();setView('${currentRank()===3?'base':'dashboard'}')">${promoted?'CLAIM YOUR NEW RANK':'BACK TO HQ'}</button></div>`);save()}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBackdrop').classList.add('open')};function closeModal(){document.getElementById('modalBackdrop').classList.remove('open')}
function buyUpgrade(id){let prices={quarters:75+state.upgrades.quarters*50,lab:100+state.upgrades.lab*50,training:125+state.upgrades.training*50};let unlock={quarters:1,lab:2,training:1};if(currentRank()<unlock[id]||state.credits<prices[id])return;state.credits-=prices[id];state.upgrades[id]++;if(id==='quarters'){state.inventory.push({name:'Rocket Grunt',emoji:'🕵️',type:'Recruit',power:2,level:1,id:state.nextId++})}if(id==='training')state.inventory.forEach(p=>{p.level++});toast(`${id==='quarters'?'A new grunt joined the crew!':id==='lab'?'Snagging gear upgraded!':'Training room improved!'}`);save()}
function expandBase(){let cost=300+state.baseSize*250;if(currentRank()!==3||state.credits<cost)return;state.credits-=cost;state.baseSize++;toast(`Hideout expanded to sector ${state.baseSize}!`);save()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script></body></html>
